<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <title>WebAR - Memorial San Martín</title>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 99999;

            padding: 10px 20px;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            font-family: Arial, sans-serif;
            font-size: 18px;

            border-radius: 8px;

            text-align: center;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="status">
        Inicializando cámara...
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >

        <a-nft
            id="target"
            type="nft"
            url="assets/cuadrado_test/cuadrado_test"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5"
        >

            <a-entity
                id="memorial-model"
                gltf-model="assets/Sanmar02.gltf"
                position="60 60 -20"
                rotation="0 0 90"
                scale="80 80 80">
            </a-entity>

        </a-nft>

        <a-entity camera></a-entity>

    </a-scene>

    <script>

        const status = document.getElementById("status");
        const target = document.getElementById("target");

        /*
         * A-Frame terminó de inicializar
         */
        document.querySelector("a-scene").addEventListener(
            "loaded",
            () => {

                console.log("A-Frame cargado");

                status.textContent =
                    "Cámara iniciada. Buscando imagen...";

            }
        );


        /*
         * AR.js encontró la imagen
         */
        target.addEventListener(
            "markerFound",
            () => {

                console.log("¡¡IMAGEN ENCONTRADA!!");

                status.textContent =
                    "¡¡IMAGEN ENCONTRADA!!";

            }
        );


        /*
         * AR.js dejó de encontrar la imagen
         */
        target.addEventListener(
            "markerLost",
            () => {

                console.log("Imagen perdida");

                status.textContent =
                    "Imagen perdida";

            }
        );


        /*
         * Errores de carga
         */
        window.addEventListener(
            "error",
            (event) => {

                console.error(
                    "Error:",
                    event.error || event.message
                );

                status.textContent =
                    "Error. Revisá la consola.";

            }
        );

    </script>

</body>

</html>
