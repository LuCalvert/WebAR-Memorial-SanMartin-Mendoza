<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <title>WebAR - Memorial San Martín</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js NFT -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;

            position: absolute;
            top: 0;
            left: 0;

            background-color: rgba(0, 0, 0, 0.8);

            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arjs-loader div {
            text-align: center;
            font-size: 1.2em;
            color: white;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- Pantalla mientras AR.js carga los archivos NFT -->
    <div class="arjs-loader">
        <div>
            Cargando realidad aumentada...
        </div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >

        <!--
            Imagen utilizada como referencia para el tracking.

            Si tenés:
                cuadrado_test.fset
                cuadrado_test.fset3
                cuadrado_test.iset

            se coloca solamente:
                cuadrado_test
        -->
        <a-nft
            type="nft"
            url="assets/cuadrado_test/cuadrado_test"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5"
        >

            <!-- Modelo 3D -->
            <a-entity
                gltf-model="assets/scene.gltf"
                position="0 0 0"
                scale="1 1 1">
            </a-entity>

        </a-nft>

        <!-- Cámara -->
        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
