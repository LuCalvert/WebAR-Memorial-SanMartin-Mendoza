<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <title>WebAR - Test NFT</title>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 99999;

            padding: 10px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <div id="status" class="status">
        Cargando NFT...
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >

        <a-nft
            id="target"
            type="nft"
            url="assets/cuadrado_test/cuadrado_test"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5"
        >

            <!-- SOLO PARA PROBAR EL TRACKING -->
            <a-box
                position="0 0 0"
                scale="1 1 1"
                color="red">
            </a-box>

        </a-nft>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const status = document.getElementById("status");
        const target = document.getElementById("target");

        window.addEventListener("arjs-nft-loaded", () => {
            console.log("NFT cargado");
            status.textContent = "NFT cargado. Buscando imagen...";
        });

        target.addEventListener("markerFound", () => {
            console.log("¡¡IMAGEN ENCONTRADA!!");
            status.textContent = "¡¡IMAGEN ENCONTRADA!!";
        });

        target.addEventListener("markerLost", () => {
            console.log("Imagen perdida");
            status.textContent = "Imagen perdida";
        });
    </script>

</body>

</html>
